<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Sign In — Createx</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <h2 style="text-align: center; color: var(--dark); margin-bottom: 12px;">Sign in</h2>
    <p style="text-align: center; font-size: 14px; color: var(--gray-700); margin-bottom: 24px;">Sign in to your account using email and password provided during registration.</p>
    <form onsubmit="event.preventDefault(); window.location.href='index.html';">
      <div class="form-group"><label>Email</label><input type="email" class="form-control" placeholder="Your working email" required></div>
      <div class="form-group"><label>Password</label><input type="password" class="form-control" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 20px;">Sign in</button>
    </form>
    <p style="text-align: center; font-size: 14px;">Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700;">Sign up</a></p>
  </div>
</body>
</html>
