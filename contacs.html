<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Contacts — Createx</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">CREATE<span>X</span></a>
      <ul class="nav-menu">
        <li><a href="about.html">About Us</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="events-list.html">Events</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contacts.html" class="active">Contacts</a></li>
      </ul>
      <a href="signin.html" style="font-weight: 700;">Log in / Register</a>
    </div>
  </header>

  <section class="section">
    <div class="container grid-2">
      <div>
        <p class="section-subtitle">Contact info</p>
        <h1 class="section-title">Get in touch</h1>
        <div class="side-item"><small>Talk to us:</small><strong style="color: var(--dark); font-size: 18px;">hello@createx.com</strong></div>
        <div class="side-item"><small>Call us:</small><strong style="color: var(--dark); font-size: 18px;">(405) 555-0128</strong></div>
        <div class="side-item"><small>Address:</small><strong style="color: var(--dark); font-size: 18px;">2464 Royal Ln. Mesa, New Jersey 45463, USA</strong></div>
      </div>
      <div style="background: var(--gray-200); border-radius: 4px; display: flex; align-items: center; justify-content: center; min-height: 320px;">
        <span style="color: var(--gray-700); font-weight: 700;">[ Google Maps Placeholder ]</span>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top: 0;">
    <div class="container grid-2" style="align-items: center;">
      <img src="https://placehold.co/450x450/FFFFFF/FF3F3A?text=Support+Illustration" alt="Support" style="width: 100%;">
      <div>
        <p class="section-subtitle">Any questions?</p>
        <h2 class="section-title">Drop us a line</h2>
        <form onsubmit="event.preventDefault(); alert('Xabaringiz yuborildi!');">
          <div class="grid-2" style="gap: 16px;">
            <div class="form-group"><label>First Name*</label><input type="text" class="form-control" placeholder="Your first name" required></div>
            <div class="form-group"><label>Last Name*</label><input type="text" class="form-control" placeholder="Your last name" required></div>
          </div>
          <div class="grid-2" style="gap: 16px;">
            <div class="form-group"><label>Email*</label><input type="email" class="form-control" placeholder="Your working email" required></div>
            <div class="form-group"><label>Phone</label><input type="tel" class="form-control" placeholder="Your phone number"></div>
          </div>
          <div class="form-group"><label>Message*</label><textarea class="form-control" placeholder="Your message" required></textarea></div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Send message</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container"><div class="footer-bottom"><span>© Createx Studio</span><a href="index.html" style="color: #fff;">HOME</a></div></div></footer>
</body>
</html>
